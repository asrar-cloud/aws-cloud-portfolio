<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asrar | Docker learning lab</title>
  <style>
    :root{color-scheme:dark; font-family:system-ui,-apple-system,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1830;color:#f4f9fc}
    main{max-width:38rem;margin:1.25rem;padding:2rem;border:1px solid #477e96;border-radius:1rem;background:#112940}
    span{color:#ffab4a;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem}
    h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.05;margin:.7rem 0;color:#77dce7}
    p{line-height:1.6;color:#d0e1ea}
    code{color:#ffbd73}
  </style>
</head>
<body>
  <main>
    <span>Local learning lab</span>
    <h1>Inside the container</h1>
    <p>This page is packaged in a Docker image and served by a running container on port <code>8000</code>.</p>
    <p>The host publishes it only to <code>127.0.0.1:8080</code>.</p>
  </main>
</body>
</html>
